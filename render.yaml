services:
  # 1. Backend Service (API)
  - type: web
    name: vibemap-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend Service (Trang web)
  - type: web
    name: vibemap-frontend
    runtime: static
    buildCommand: npm install && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
