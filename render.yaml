services:
  # 1. Backend Service (API)
  - type: web
    name: vibemap-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false

  # 2. Frontend Service (Trang web)
  - type: web
    name: vibemap-frontend
    env: static
    buildCommand: npm install && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
